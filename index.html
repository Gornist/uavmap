<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171614" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Радиус — радиовидимость дрона</title>
  <!-- соединения к серверам тайлов открываем заранее: на мобильной сети DNS и TLS — заметная часть первой загрузки карты -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin />
</head>
<body>
  <div id="map"></div>

  <!-- прицел -->
  <div id="cross" aria-hidden="true">
    <svg viewBox="0 0 48 48" width="48" height="48">
      <circle cx="24" cy="24" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M24 4v12M24 32v12M4 24h12M32 24h12" stroke="currentColor" stroke-width="2"/>
      <circle cx="24" cy="24" r="1.6" fill="currentColor"/>
    </svg>
  </div>
  <!-- под прицелом: высота места (относительно пульта, если он стоит); нажатие — «Точка» с координатами -->
  <button id="crossChip" class="cross-chip" title="Точка: координаты, высота, профиль"><span id="crossChipText">Рельеф —</span><span class="cc-more" aria-hidden="true">›</span></button>

  <!-- высотомер: высота дрона и связь на каждой высоте (altimeter.ts) -->
  <div id="altimeter" class="altimeter" hidden role="slider" tabindex="0" aria-label="Высота дрона" aria-valuemin="0" aria-valuemax="5000">
    <div class="alt-cap alt-name" aria-hidden="true">Дрон</div>
    <div class="alt-track">
      <div class="alt-bands"></div>
      <div class="alt-ticks"></div>
      <div class="alt-drone"><button type="button" class="alt-lbl" title="Нажмите, чтобы ввести точную высоту"></button></div>
    </div>
    <div class="alt-cap">м над <br>взлётом</div>
  </div>

  <!-- кнопки карты: у правого края (у левого — высотомер), на ландшафте телефона — ряд внизу слева -->
  <div id="mapBar">
    <div class="zoom-pill">
      <button id="zIn" title="Приблизить" aria-label="Приблизить">+</button>
      <button id="zOut" title="Отдалить" aria-label="Отдалить">−</button>
    </div>
    <button class="round" id="btnGps" title="Где я" aria-label="Где я"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="4.6" r="2.4" fill="currentColor"/><path d="M12 8.2c-2 0-3.4 1.1-3.4 3v4.2h1.8V22h3.2v-6.6h1.8v-4.2c0-1.9-1.4-3-3.4-3z" fill="currentColor"/></svg></button>
    <!-- линия пульт → прицел на карте: вкл/выкл (по умолчанию выключена — не мешает обзору) -->
    <button class="round" id="btnLink" title="Линия от пульта к прицелу" aria-label="Линия от пульта к прицелу" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="19" r="2.6" fill="currentColor"/><path d="M7 17 L16 8" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/><circle cx="18" cy="6" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M18 1v2.4M18 8.6V11M13 6h2.4M20.6 6H23" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="round" id="btnHome" title="К пульту">⌂</button>
  </div>

  <!-- строка связи: пульт → прицел (всегда видна; прячется при открытой шторке и линейке) -->
  <div id="linkStrip">
    <div id="lsOffer" class="ls-offer" hidden></div>
    <div id="lsEmpty" class="ls-empty">
      <p>Поставьте пульт там, где будете стоять</p>
      <div class="ls-acts">
        <button id="btnStHere" class="primary">📡 Пульт здесь</button>
        <button id="btnStGps" class="ghost">⌖ По GPS</button>
      </div>
    </div>
    <div id="lsMain" hidden>
      <div class="ls-status" id="lsStatus" aria-live="polite" role="button" tabindex="0" title="Открыть профиль трассы"></div>
    </div>
  </div>

  <nav id="bottomBar">
    <button id="btnMark" title="Метка в прицел"><span class="ico">⚑</span><span class="tx">Метка</span></button>
    <button id="btnZone" title="Зона покрытия вокруг пульта"><span class="ico">◎</span><span class="tx">Зона</span></button>
    <button id="btnBest" title="Где встать пилоту, чтобы связь с прицелом была лучше"><span class="ico">◆</span><span class="tx">Где встать</span></button>
    <button id="btnMenu" title="Меню"><span class="ico">☰</span><span class="tx">Меню</span></button>
  </nav>

  <div id="rulerBar" hidden>
    <span id="rulerText">Линейка: ставьте точки прицелом</span>
    <button id="rulerAdd" class="primary">+ точка</button>
    <button id="rulerUndo">↶</button>
    <button id="rulerSave">В маршрут</button>
    <button id="rulerDone">Готово</button>
  </div>

  <div id="progress" hidden><div></div><span></span></div>

  <aside id="drawer" aria-hidden="true">
    <div class="dr-head">
      <div>
        <div class="logo big">РАДИУС</div>
        <div class="dr-sub">Где будет связь с дроном</div>
      </div>
      <button class="mini" id="drClose">✕</button>
    </div>
    <div id="drBody"></div>
  </aside>
  <div id="scrim"></div>

  <section id="sheet" hidden>
    <div class="sh-grip" id="shGrip" aria-hidden="true"></div>
    <div class="sh-head"><h3 id="shTitle"></h3><button class="mini" id="shClose">✕</button></div>
    <div id="shBody"></div>
  </section>

  <div id="toast"></div>
  <input type="file" id="fileIn" accept=".geojson,.json,.gpx,.kml" hidden />

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
